name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: stage-web-pilots.mjs proves published pilots never changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run build
      # Frozen research pilots ride along at /pilot/<version>/; a drifted
      # tree fails the deploy rather than changing a running cohort's build.
      - run: node scripts/stage-web-pilots.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Prove what Pages actually serves, not only what was uploaded.
  verify-pilots:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - run: |
          for manifest in pilot/*.manifest.json; do
            [ -e "$manifest" ] || continue
            node scripts/verify-web-pilot.mjs "$manifest"
          done
