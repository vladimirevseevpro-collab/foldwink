name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run validate:ru
      - run: npm run validate:de
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:budget
      - run: npm audit --omit=dev
      - name: Rebuild and pack the checked commit in an isolated worktree
        run: npm run release:verify-rebuild -- --capture "$GITHUB_SHA" --output tmp-debug/ci-exact-commit-rebuild.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-commit-rebuild-${{ github.sha }}
          path: |
            tmp-debug/ci-exact-commit-rebuild.json
            tmp-debug/ci-exact-commit-rebuild.log
          if-no-files-found: error
          retention-days: 30
