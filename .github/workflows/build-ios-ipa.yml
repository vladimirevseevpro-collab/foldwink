name: Build iOS IPA (Free Apple ID / Sideloadly)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag name (e.g. v0.8.2-ios)"
        required: false
        default: ""

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync iOS project
        run: npm run mobile:sync

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Foldwink.xcarchive \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Foldwink.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -y -9 Foldwink.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foldwink-iOS-IPA
          path: build/Foldwink.ipa
          retention-days: 14
