<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foldwink Sound Room</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Manrope Variable", Manrope, system-ui, sans-serif;
        background: #101410;
        color: #edf1e9;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background-color: #101410;
        background-image:
          linear-gradient(rgba(16, 20, 16, 0.91), rgba(16, 20, 16, 0.91)),
          url("/textures/graphite-paper.webp");
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .masthead {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 18px;
        padding: 0 0 28px;
        border-bottom: 1px solid #354038;
      }

      .mark {
        position: relative;
        width: 50px;
        height: 50px;
        border: 2px solid #152019;
        border-radius: 5px;
        background: #edf0e7;
        box-shadow: 0 5px 0 #4a5c50;
      }

      .mark::before {
        position: absolute;
        right: -2px;
        top: -2px;
        width: 19px;
        height: 19px;
        content: "";
        background: #49dbc5;
        clip-path: polygon(0 0, 100% 0, 100% 100%);
      }

      .mark::after {
        position: absolute;
        right: 5px;
        top: 7px;
        width: 9px;
        height: 2px;
        content: "";
        background: #152019;
        transform: rotate(45deg);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.65rem, 4vw, 2.5rem);
        font-weight: 780;
        line-height: 1;
      }

      .eyebrow,
      .status,
      .section-label,
      .duration,
      .specs {
        font-size: 0.72rem;
        font-weight: 720;
        text-transform: uppercase;
        color: #9da99e;
      }

      .eyebrow {
        margin-bottom: 7px;
        color: #49dbc5;
      }

      .status {
        min-width: 146px;
        text-align: right;
      }

      .status[data-ready="true"] {
        color: #b9f0c9;
      }

      .control-band {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 0;
        border-bottom: 1px solid #354038;
      }

      .command,
      .icon-command {
        min-height: 44px;
        border: 1px solid #526158;
        border-radius: 5px;
        background: #1a211b;
        box-shadow: 0 3px 0 #0a0d0b;
        cursor: pointer;
      }

      .command {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        font-size: 0.82rem;
        font-weight: 750;
      }

      .command:hover,
      .icon-command:hover {
        border-color: #49dbc5;
        background: #202a22;
      }

      .command:active,
      .icon-command:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #0a0d0b;
      }

      .play-icon {
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 9px solid #49dbc5;
      }

      .icon-command {
        width: 44px;
        padding: 0;
        color: #49dbc5;
        font-size: 1rem;
        font-weight: 800;
      }

      .volume-control {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 190px;
        margin-left: auto;
      }

      .volume-control label {
        font-size: 0.75rem;
        font-weight: 720;
        color: #b9c1b9;
      }

      input[type="range"] {
        width: 130px;
        accent-color: #49dbc5;
      }

      .cue-section {
        padding-top: 30px;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      h2 {
        flex: 0 0 auto;
        font-size: 1rem;
        font-weight: 760;
      }

      .section-label {
        min-width: 0;
        max-width: 55%;
        line-height: 1.4;
        overflow-wrap: anywhere;
        text-align: right;
      }

      .cue-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border-top: 1px solid #445047;
      }

      .cue {
        display: grid;
        grid-template-columns: 32px minmax(120px, 0.85fr) minmax(120px, 1.15fr) 56px;
        align-items: center;
        gap: 14px;
        min-height: 90px;
        padding: 13px 16px;
        border: 0;
        border-right: 1px solid #445047;
        border-bottom: 1px solid #445047;
        background: rgba(24, 31, 25, 0.72);
        text-align: left;
        cursor: pointer;
      }

      .cue:nth-child(even) {
        border-right: 0;
      }

      .cue:hover,
      .cue[data-playing="true"] {
        background: #edf0e7;
        color: #172019;
      }

      .cue[data-playing="true"] {
        box-shadow: inset 4px 0 #49dbc5;
      }

      .cue-number {
        font-size: 0.7rem;
        font-weight: 800;
        color: #49dbc5;
      }

      .cue-copy strong,
      .cue-copy span {
        display: block;
      }

      .cue-copy strong {
        font-size: 0.92rem;
        font-weight: 780;
      }

      .cue-copy span {
        margin-top: 4px;
        color: #9da99e;
        font-size: 0.7rem;
        font-weight: 620;
      }

      .cue:hover .cue-copy span,
      .cue[data-playing="true"] .cue-copy span,
      .cue:hover .duration,
      .cue[data-playing="true"] .duration {
        color: #59645b;
      }

      .waveform {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 34px;
        overflow: hidden;
      }

      .waveform i {
        flex: 1 1 0;
        min-width: 1px;
        height: 8%;
        background: #7a887d;
      }

      .cue:hover .waveform i,
      .cue[data-playing="true"] .waveform i {
        background: #209b8a;
      }

      .duration {
        text-align: right;
      }

      .specs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        padding-top: 28px;
        border-top: 1px solid #354038;
        margin-top: 34px;
      }

      .specs strong {
        color: #edf1e9;
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 22px, 560px);
          padding-top: 20px;
        }

        .masthead {
          grid-template-columns: auto 1fr;
        }

        .status {
          grid-column: 1 / -1;
          min-width: 0;
          text-align: left;
        }

        .control-band {
          flex-wrap: wrap;
        }

        .volume-control {
          width: 100%;
          min-width: 0;
          margin-left: 0;
        }

        input[type="range"] {
          flex: 1;
          width: auto;
          min-width: 0;
          max-width: 100%;
        }

        .section-head {
          align-items: flex-start;
          gap: 10px;
        }

        .section-label {
          max-width: 48%;
          font-size: 0.62rem;
        }

        .cue-grid {
          grid-template-columns: 1fr;
        }

        .cue,
        .cue:nth-child(even) {
          grid-template-columns: 26px minmax(105px, 0.9fr) minmax(82px, 1.1fr) 48px;
          gap: 9px;
          min-height: 80px;
          padding: 11px 9px;
          border-right: 0;
        }

        .cue-copy strong {
          font-size: 0.82rem;
        }

        .waveform {
          gap: 1px;
          height: 28px;
        }

        .duration {
          font-size: 0.62rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="mark" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">Foldwink / R3 master</p>
          <h1>Sound room</h1>
        </div>
        <p class="status" id="status" aria-live="polite">Loading local pack</p>
      </header>

      <div class="control-band">
        <button class="command" id="play-sequence" type="button">
          <span class="play-icon" aria-hidden="true"></span>
          Play sequence
        </button>
        <button class="icon-command" id="toggle-mute" type="button" title="Mute">M</button>
        <div class="volume-control">
          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" />
        </div>
      </div>

      <main>
        <section class="cue-section" aria-labelledby="actions-title">
          <div class="section-head">
            <h2 id="actions-title">Tactile actions</h2>
            <span class="section-label">paper / ceramic / walnut</span>
          </div>
          <div class="cue-grid" id="action-cues"></div>
        </section>

        <section class="cue-section" aria-labelledby="outcomes-title">
          <div class="section-head">
            <h2 id="outcomes-title">Outcomes</h2>
            <span class="section-label">short ritual, no fanfare</span>
          </div>
          <div class="cue-grid" id="outcome-cues"></div>
        </section>
      </main>

      <footer class="specs" id="specs"></footer>
    </div>
    <script type="module" src="./sound-lab.ts"></script>
  </body>
</html>
